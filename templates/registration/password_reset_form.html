{% extends "base.html" %}
{% block title %}Reset password · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth__card">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email and we'll send you a link to choose a new one.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "components/form.html" %}
      <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
    </form>
    <p class="auth__alt"><a href="{% url 'accounts:login' %}">← Back to login</a></p>
  </div>
</div>
{% endblock %}
