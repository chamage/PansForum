{% extends "base.html" %}
{% block title %}Check your inbox · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth__card">
    <h1>Check your inbox 📬</h1>
    <p>If an account exists for that email, we've sent a link to reset your password. It may take a minute — check your spam folder too.</p>
    <p class="auth__alt"><a href="{% url 'accounts:login' %}">← Back to login</a></p>
  </div>
</div>
{% endblock %}
