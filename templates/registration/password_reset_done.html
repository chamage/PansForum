{% extends "base.html" %}
{% load forum_extras %}
{% block title %}Check your inbox · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth__card">
    <h1>Check your inbox</h1>
    <p>If an account exists for that email, we've sent a link to reset your password.</p>
    <p class="auth__alt"><a href="{% url 'accounts:login' %}">{% icon "arrow-left" "icon--sm" %} Back to login</a></p>
  </div>
</div>
{% endblock %}
