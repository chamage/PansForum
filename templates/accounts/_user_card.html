{% load forum_extras %}<article class="card user-card">
  <a href="{{ person.get_absolute_url }}" class="user-card__link">
    {% avatar person "lg" %}
    <span class="user-card__name">{{ person.name }}</span>
    <span class="muted small">@{{ person.username }}</span>
    {% if person.field_of_study %}<span class="muted small">{{ person.field_of_study }}</span>{% endif %}
  </a>
  {% if user.is_authenticated and user.pk != person.pk %}
    <div class="user-card__actions">
      <a class="btn btn--ghost btn--sm" href="{% url 'accounts:chat_thread' person.username %}">{% icon "message" "icon--sm" %} Message</a>
    </div>
  {% endif %}
</article>
