{% extends "accounts/settings_base.html" %}
{% block settings %}
<h1>Change password</h1>
<p class="muted">Use at least 10 characters. A short sentence is easier to remember and harder to guess.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "components/form.html" %}
  <div class="form-actions"><button class="btn btn--primary" type="submit">Change password</button></div>
</form>
{% endblock %}
