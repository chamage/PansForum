{% if can_send %}
  <form method="post" action="{% url 'accounts:chat_thread' active_partner.username %}" enctype="multipart/form-data" class="chat-form-wrap" data-chat-send-form>
    {% csrf_token %}

    {% if is_friends %}
      <div class="chat-attachment-bar" id="chat-attachment-bar" hidden>
        <img id="chat-attachment-thumb" class="chat-attachment-bar__thumb" src="" alt="Preview">
        <span id="chat-attachment-name" class="small muted"></span>
        <button type="button" class="btn btn--ghost btn--sm" data-clear-chat-media aria-label="Remove attachment">✕ Remove</button>
      </div>
    {% endif %}

    <div class="chat-form">
      {% if is_friends %}
        <div class="chat-tools">
          <label class="btn btn--ghost btn--sm chat-tool-btn" for="id_chat_attachment" title="Send photo or GIF file (friends only, max 4 MB)">
            📷 <span class="sr-only">Attach media</span>
          </label>
          <input type="file" name="attachment" id="id_chat_attachment" accept="image/png,image/jpeg,image/webp,image/gif" class="sr-only" data-chat-media-input>
        </div>
      {% endif %}

      <label class="sr-only" for="id_body">Message</label>
      <textarea name="body" id="id_body" rows="2" maxlength="4000" placeholder="{% if is_friends %}Write a message or attach media…{% else %}Write a message…{% endif %}"></textarea>
      <button type="submit" class="btn btn--primary">{% if not is_friends and not conversation %}Send request{% else %}Send{% endif %}</button>
    </div>
  </form>
{% elif waiting_for_response %}
  <div class="chat-locked muted small">
    ⏳ Message request sent to <strong>{{ active_partner.name }}</strong>. You'll be able to send more messages once they respond or accept your request.
  </div>
{% endif %}
