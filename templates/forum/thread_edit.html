{% extends "base.html" %}
{% block title %}Edit thread · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card form-card">
    <h1>Edit thread</h1>
    <p class="muted">{{ thread.title }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "components/form.html" %}
      <div class="form-actions">
        <a class="btn btn--ghost" href="{{ thread.get_absolute_url }}">Cancel</a>
        <button class="btn btn--primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
