{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn--ghost btn--sm" href="{% querystring page=page.previous_page_number %}">← Newer</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--ghost btn--sm" href="{% querystring page=page.next_page_number %}">Older →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
