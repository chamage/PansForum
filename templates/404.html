{% extends "base.html" %}
{% load forum_extras %}
{% block title %}Page not found · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth__card empty">
    <div class="empty__icon" aria-hidden="true">{% icon "compass" "icon--lg" %}</div>
    <h1>Page not found</h1>
    <p class="muted">That thread, community, or profile doesn't exist or was removed.</p>
    <a class="btn btn--primary" href="{% url 'forum:home' %}">Back to home</a>
  </div>
</div>
{% endblock %}
